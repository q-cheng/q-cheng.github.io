<style>
.jp-page{background:#f5f5f7;color:#1d1d1f;min-height:100vh;padding:96px 0 72px}
.jp-app[hidden],.jp-login[hidden]{display:none!important}
.jp-login{min-height:58vh;display:flex;align-items:center;justify-content:center;padding:24px}
.jp-login-card{width:min(100%,420px);background:#fff;border:1px solid #d2d2d7;border-radius:22px;padding:30px;box-shadow:0 14px 45px rgba(0,0,0,.08);text-align:center}
.jp-login-icon{width:54px;height:54px;border-radius:16px;background:#f5f5f7;display:grid;place-items:center;margin:0 auto 18px;font-size:25px}
.jp-login-card h1{font-size:30px;line-height:1.15;margin:0 0 8px;letter-spacing:-.025em}
.jp-login-card p{margin:0 0 22px;color:#6e6e73;font-size:15px;line-height:1.5}
.jp-login-form{display:flex;gap:8px}
.jp-login-input{flex:1;min-width:0;height:46px;box-sizing:border-box;border:1px solid #d2d2d7;border-radius:12px;padding:0 14px;font-size:15px;outline:none}
.jp-login-input:focus{border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.jp-login-button{height:46px;border:0;border-radius:12px;background:#1d1d1f;color:#fff;padding:0 18px;font-weight:600;cursor:pointer}
.jp-login-error{min-height:20px;margin-top:10px;color:#b42318;font-size:13px;text-align:left}
.jp-shell{max-width:1080px;margin:0 auto;padding:0 28px}
.jp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}

.jp-eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#86868b;margin-bottom:8px}
.jp-head h1{font-size:48px;line-height:1.06;margin:0 0 10px;font-weight:700;letter-spacing:-.035em}
.jp-head p{margin:0;color:#6e6e73;font-size:18px;line-height:1.55}
.jp-filter-frame{background:rgba(255,255,255,.78);border:1px solid #d2d2d7;border-radius:18px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 28px rgba(0,0,0,.035);margin-bottom:18px;overflow-x:auto}
.jp-toolbar{display:flex;flex-wrap:nowrap;gap:8px;align-items:stretch;width:max-content;min-width:100%}
.jp-toolbar .jp-search{flex:1 1 340px;min-width:280px}
.jp-toolbar select{flex:0 0 145px;min-width:145px}
.jp-toolbar .jp-review{flex:0 0 auto}
.jp-control{display:block;box-sizing:border-box;height:44px!important;margin:0!important;border:1px solid #d2d2d7;border-radius:12px;background:rgba(255,255,255,.92);color:#1d1d1f;padding:0 13px!important;font-size:14px;line-height:44px;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.03);vertical-align:top}
.jp-control:focus{border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.jp-review{height:44px;border:0;border-radius:12px;background:#1d1d1f;color:#fff;padding:0 17px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.jp-review:hover{background:#333336}
.jp-meta{margin:0 0 26px;color:#86868b;font-size:13px}
.jp-section{margin-top:32px}
.jp-section-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid #d2d2d7}
.jp-section-head h2{margin:0;font-size:22px;letter-spacing:-.015em}
.jp-section-head span{font-size:12px;color:#86868b}
.jp-note{padding:22px 0;border-bottom:1px solid #e1e1e6}
.jp-note-top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
.jp-original{font-size:19px;line-height:1.7;font-weight:600;letter-spacing:-.01em}
.jp-note-meta{font-size:12px;color:#86868b;white-space:nowrap;padding-top:4px}
.jp-answer{margin-top:15px;padding:15px 17px;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 18px rgba(0,0,0,.035)}
.jp-answer.hidden .jp-answer-inner{filter:blur(8px);user-select:none}
.jp-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#86868b;margin:8px 0 4px}
.jp-label:first-child{margin-top:0}
.jp-corrected{font-size:17px;line-height:1.8}
.jp-diff-equal{color:#1d1d1f}
.jp-diff-add{background:#e8f7ee;color:#157347;border-radius:5px;padding:1px 2px}
.jp-diff-remove{background:#fdecec;color:#b42318;border-radius:5px;padding:1px 2px;text-decoration:line-through;text-decoration-thickness:1.5px}
.jp-diff-replace{background:#eaf2ff;color:#175cd3;border-radius:5px;padding:1px 2px}
.jp-diff-old{color:#b42318;text-decoration:line-through;margin-right:3px;font-size:.88em}
.jp-diff-arrow{color:#86868b;margin:0 2px;font-size:.82em}
.jp-natural,.jp-why{font-size:15px;color:#515154;line-height:1.65}
.jp-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.jp-tag{display:inline-flex;align-items:center;border-radius:999px;background:#ececf1;color:#6e6e73;padding:5px 8px;font-size:11px;line-height:1}
.jp-tag.lesson{background:#e8f1fb;color:#0066cc;font-weight:600}
.jp-toggle{margin-top:12px;border:0;background:none;color:#0066cc;padding:0;cursor:pointer;font-size:13px;font-weight:500}
.jp-empty{padding:44px 0;text-align:center;color:#86868b}
@media(max-width:640px){
  .jp-page{padding-top:78px}
  .jp-shell{padding:0 18px}
  .jp-head{display:block}
  .jp-head h1{font-size:38px}
  .jp-head p{font-size:16px}
  .jp-toolbar{grid-template-columns:1fr 1fr}
  .jp-toolbar .jp-search{grid-column:1/-1}
  .jp-toolbar .jp-review{grid-column:1/-1}
  .jp-filter-frame{padding:10px}
    .jp-note-top{display:block}
  .jp-note-meta{margin-top:6px}
}
</style>

<div class="jp-page">
  <section id="jp-login" class="jp-login" aria-labelledby="jp-login-title">
    <div class="jp-login-card">
      <div class="jp-login-icon">🔒</div>
      <h1 id="jp-login-title">Japanese Learning</h1>
      <p>This section is private. Enter the password to continue.</p>
      <form id="jp-login-form" class="jp-login-form">
        <input id="jp-password" class="jp-login-input" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
        <button class="jp-login-button" type="submit">Unlock</button>
      </form>
      <div id="jp-login-error" class="jp-login-error" role="alert" aria-live="polite"></div>
    </div>
  </section>

  <div id="jp-app" class="jp-app" hidden>
  <div class="jp-shell">
    <header class="jp-head">
      <div class="jp-title-wrap">
        <div class="jp-eyebrow">Study notebook</div>
        <h1>Japanese Learning</h1>
        <p>Corrections and grammar notes from my own study, organized by lesson and mistake type.</p>
      </div>
    </header>

    <div class="jp-filter-frame">
      <div class="jp-toolbar">
        <input id="jp-search" class="jp-control jp-search" placeholder="Search notes" aria-label="Search notes">
        <select id="jp-lesson" class="jp-control" aria-label="Filter by lesson"><option value="">All lessons</option></select>
        <select id="jp-group" class="jp-control" aria-label="Filter by group"><option value="">All groups</option></select>
        <select id="jp-tag" class="jp-control" aria-label="Filter by tag"><option value="">All tags</option></select>
        <button id="jp-random" class="jp-review" type="button">Random review</button>
      </div>
    </div>

    <div class="jp-meta"><div id="jp-stats"></div></div>

    <div id="jp-content"></div>
  </div>
  </div>
</div>

<script>
(function(){
  const state={data:null,hidden:new Set()};
  const PASSWORD_HASH="7f4ba5383793d3f7b4c0c11817cd6670c0ebf96f66448d3f6967a2085aee5e75";
  const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));

  async function sha256(value){
    const bytes=new TextEncoder().encode(value);
    const digest=await crypto.subtle.digest("SHA-256",bytes);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

  async function unlock(password){
    return (await sha256(password))===PASSWORD_HASH;
  }

  async function init(){
    const res=await fetch("{{ site.baseurl }}/japanese-learning.json",{cache:"no-store"});
    state.data=await res.json();

    const lessons=[...new Set(state.data.entries.map(e=>e.lesson).filter(Boolean))].sort().reverse();
    const groups=[...new Set(state.data.entries.map(e=>e.group))].sort();
    const tags=[...new Set(state.data.entries.flatMap(e=>e.tags||[]))].sort();

    const lessonSel=document.getElementById("jp-lesson");
    const groupSel=document.getElementById("jp-group");
    const tagSel=document.getElementById("jp-tag");

    lessons.forEach(v=>lessonSel.insertAdjacentHTML("beforeend",'<option value="'+esc(v)+'">Lesson '+esc(v)+'</option>'));
    groups.forEach(v=>groupSel.insertAdjacentHTML("beforeend",'<option value="'+esc(v)+'">'+esc(v)+'</option>'));
    tags.forEach(v=>tagSel.insertAdjacentHTML("beforeend",'<option value="'+esc(v)+'">'+esc(v)+'</option>'));

    render();
  }

  function filtered(){
    const q=document.getElementById("jp-search").value.trim().toLowerCase();
    const lesson=document.getElementById("jp-lesson").value;
    const group=document.getElementById("jp-group").value;
    const tag=document.getElementById("jp-tag").value;

    return state.data.entries.filter(e=>
      (!lesson||e.lesson===lesson)&&
      (!group||e.group===group)&&
      (!tag||(e.tags||[]).includes(tag))&&
      (!q||[e.original,e.corrected,e.natural,e.explanation_zh,e.group,e.lesson,(e.tags||[]).join(" ")].join(" ").toLowerCase().includes(q))
    );
  }

  function chars(s){
    if(typeof Intl!=="undefined"&&Intl.Segmenter){
      return [...new Intl.Segmenter("ja",{granularity:"grapheme"}).segment(String(s??""))].map(x=>x.segment);
    }
    return Array.from(String(s??""));
  }

  function editOps(aText,bText){
    const a=chars(aText),b=chars(bText),m=a.length,n=b.length;
    const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
    for(let i=0;i<=m;i++)dp[i][0]=i;
    for(let j=0;j<=n;j++)dp[0][j]=j;
    for(let i=1;i<=m;i++){
      for(let j=1;j<=n;j++){
        if(a[i-1]===b[j-1]) dp[i][j]=dp[i-1][j-1];
        else dp[i][j]=Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1])+1;
      }
    }
    const ops=[];
    let i=m,j=n;
    while(i>0||j>0){
      if(i>0&&j>0&&a[i-1]===b[j-1]){
        ops.push({type:"equal",old:a[i-1],neu:b[j-1]}); i--; j--;
      }else if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+1){
        ops.push({type:"replace",old:a[i-1],neu:b[j-1]}); i--; j--;
      }else if(i>0&&dp[i][j]===dp[i-1][j]+1){
        ops.push({type:"remove",old:a[i-1],neu:""}); i--;
      }else{
        ops.push({type:"add",old:"",neu:b[j-1]}); j--;
      }
    }
    ops.reverse();
    const merged=[];
    for(const op of ops){
      const last=merged[merged.length-1];
      if(last&&last.type===op.type){
        last.old+=op.old; last.neu+=op.neu;
      }else merged.push({...op});
    }
    return merged;
  }

  function inlineDiffHtml(e){
    return editOps(e.original,e.corrected).map(op=>{
      if(op.type==="equal") return '<span class="jp-diff-equal">'+esc(op.neu)+'</span>';
      if(op.type==="add") return '<span class="jp-diff-add">'+esc(op.neu)+'</span>';
      if(op.type==="remove") return '<span class="jp-diff-remove">'+esc(op.old)+'</span>';
      return '<span class="jp-diff-replace"><span class="jp-diff-old">'+esc(op.old)+'</span><span class="jp-diff-arrow">→</span>'+esc(op.neu)+'</span>';
    }).join("");
  }

  function note(e){
    const isGrammar=e.group==="Grammar notes";
    const body=isGrammar
      ? '<div class="jp-label">Meaning / usage</div><div class="jp-corrected">'+esc(e.corrected)+'</div>'+
        (e.natural?'<div class="jp-label">Simpler form</div><div class="jp-natural">'+esc(e.natural)+'</div>':"")+
        '<div class="jp-label">Explanation</div><div class="jp-why">'+esc(e.explanation_zh)+'</div>'
      : '<div class="jp-label">Correction / note</div><div class="jp-corrected">'+inlineDiffHtml(e)+'</div>'+
        (e.natural?'<div class="jp-label">Natural alternative</div><div class="jp-natural">'+esc(e.natural)+'</div>':"")+
        '<div class="jp-label">Why</div><div class="jp-why">'+esc(e.explanation_zh)+'</div>';

    return '<article class="jp-note" data-id="'+esc(e.id)+'">'+
      '<div class="jp-note-top">'+
        '<div class="jp-original">'+esc(e.original)+'</div>'+
        '<div class="jp-note-meta">'+esc(e.date)+'</div>'+
      '</div>'+
      '<div class="jp-answer '+(state.hidden.has(e.id)?"hidden":"")+'"><div class="jp-answer-inner">'+body+'</div></div>'+
      '<div class="jp-tags"><span class="jp-tag lesson">Lesson '+esc(e.lesson||"—")+'</span>'+
      (e.tags||[]).map(t=>'<span class="jp-tag">'+esc(t)+'</span>').join("")+
      '</div>'+
      '<button class="jp-toggle" type="button">'+(state.hidden.has(e.id)?"Show answer":"Hide answer")+'</button>'+
    '</article>';
  }

  function render(){
    const rows=filtered();
    const root=document.getElementById("jp-content");
    document.getElementById("jp-stats").textContent=rows.length+" of "+state.data.entries.length+" notes · updated "+state.data.last_updated;

    if(!rows.length){
      root.innerHTML='<div class="jp-empty">No matching notes.</div>';
      return;
    }

    const grouped={};
    rows.forEach(e=>(grouped[e.group]??=[]).push(e));
    root.innerHTML=Object.entries(grouped).map(([group,entries])=>
      '<section class="jp-section"><div class="jp-section-head"><h2>'+esc(group)+'</h2><span>'+entries.length+' notes</span></div>'+
      entries.map(note).join("")+'</section>'
    ).join("");

    root.querySelectorAll(".jp-toggle").forEach(b=>b.addEventListener("click",()=>{
      const id=b.closest(".jp-note").dataset.id;
      state.hidden.has(id)?state.hidden.delete(id):state.hidden.add(id);
      render();
    }));
  }

  document.getElementById("jp-search").addEventListener("input",render);
  document.getElementById("jp-lesson").addEventListener("change",render);
  document.getElementById("jp-group").addEventListener("change",render);
  document.getElementById("jp-tag").addEventListener("change",()=>{render()});

  document.getElementById("jp-random").addEventListener("click",()=>{
    const rows=filtered();
    if(!rows.length)return;
    const e=rows[Math.floor(Math.random()*rows.length)];
    state.hidden.add(e.id);
    render();
    requestAnimationFrame(()=>document.querySelector('[data-id="'+CSS.escape(e.id)+'"]')?.scrollIntoView({behavior:"smooth",block:"center"}));
  });

  const login=document.getElementById("jp-login");
  const app=document.getElementById("jp-app");
  const form=document.getElementById("jp-login-form");
  const input=document.getElementById("jp-password");
  const error=document.getElementById("jp-login-error");

  form.addEventListener("submit",async(e)=>{
    e.preventDefault();
    error.textContent="";
    const button=form.querySelector("button");
    button.disabled=true;
    try{
      if(await unlock(input.value)){
        input.value="";
        login.hidden=true;
        app.hidden=false;
        await init();
      }else{
        error.textContent="Incorrect password.";
        input.select();
      }
    }catch(err){
      error.textContent="Could not unlock this page.";
    }finally{
      button.disabled=false;
    }
  });

  requestAnimationFrame(()=>input.focus());
})();
</script>
